services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow"]
      interval: 3s
      timeout: 2s
      retries: 30
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx384m -Xms256m
    volumes: ["kafka:/var/lib/kafka/data"]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
  app:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payflow
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
      KAFKA_BOOTSTRAP: kafka:9092
      DB_POOL_SIZE: ${DB_POOL_SIZE:-24}
      REDIS_HOST: redis
      MERCHANT_PASSWORD: ${MERCHANT_PASSWORD:-local-merchant-password}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-local-operator-password}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-webhook-secret-change-me}
      JWT_SECRET: ${JWT_SECRET:-local-only-signing-secret-at-least-32-bytes-change-before-sharing}
      RATE_LIMIT: ${RATE_LIMIT:-2000}
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
      redis: {condition: service_started}
    mem_limit: 768m
volumes:
  postgres:
  kafka:
