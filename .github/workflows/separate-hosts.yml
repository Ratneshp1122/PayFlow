name: Three-run separate-host profiling
on:
  workflow_dispatch:
    inputs:
      rate: {description: Offered RPS, default: '300', required: true}
      seconds: {description: Seconds per trial, default: '15', required: true}
permissions: {contents: read, actions: read}
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Start isolated application host
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 benchmarks/separate_hosts.py secrets
          set -a; source .env; set +a
          docker compose -f compose.yml -f compose.profile.yml up -d --build
          python3 scripts/smoke.py
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          python3 benchmarks/separate_hosts.py prepare
      - uses: actions/upload-artifact@v4
        with: {name: encrypted-endpoint, path: exchange/endpoint.cms, retention-days: 1}
      - run: python3 benchmarks/separate_hosts.py wait
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: server-profile, path: evidence/}
      - run: docker compose down
        if: always()
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral encrypted-handoff key
        env: {RATE: '${{ inputs.rate }}', SECONDS_REQUESTED: '${{ inputs.seconds }}'}
        run: |
          python3 -c 'import os; assert 1<=int(os.environ["RATE"])<=1200; assert 1<=int(os.environ["SECONDS_REQUESTED"])<=60'
          mkdir -p exchange
          openssl req -x509 -newkey rsa:3072 -keyout .load-private.pem -out exchange/load-public.crt -nodes -subj '/CN=ephemeral-benchmark' -days 1
          chmod 600 .load-private.pem
      - uses: actions/upload-artifact@v4
        with: {name: load-public-certificate, path: exchange/load-public.crt, retention-days: 1}
      - name: Run three trials on a different machine
        env: {GH_TOKEN: '${{ github.token }}', RATE: '${{ inputs.rate }}', DURATION: '${{ inputs.seconds }}s'}
        run: python3 benchmarks/separate_hosts.py client
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: load-profile, path: evidence/}
  archive:
    needs: [server, load]
    if: always()
    runs-on: ubuntu-latest
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: '*-profile', path: 'benchmarks/runs/${{ github.run_id }}'}
      - name: Commit all safe run evidence
        env: {RUN_ID: '${{ github.run_id }}'}
        run: |
          python3 benchmarks/report.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/runs
          git commit -m "Record separate-host profiling $RUN_ID [skip ci]"
          for attempt in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 2; done
          exit 1
